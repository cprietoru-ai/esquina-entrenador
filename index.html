<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16110f">
<meta name="description" content="La esquina del entrenador de boxeo: biblioteca de ejercicios, bloques y planes, y un temporizador de asaltos para dar la clase. Gratis, sin cuentas y sin conexión.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Esquina del Entrenador</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
:root{
  --bg:#f4f1ee; --surface:#ffffff; --ink:#1d1715; --muted:#6c615c; --line:#ddd5cf;
  --esq:#16110f; --esq-ink:#ffffff; --rojo:#c8102e; --azul:#1f5fbf; --oro:#c99a2e; --chip:#efe9e4;
  --trabajo:#c8102e; --descanso:#1d7a46; --prep:#3a3330;
  --display:"Bebas Neue",Impact,"Arial Narrow",sans-serif;
  --body:"Barlow","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --label:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#120e0d; --surface:#1c1615; --ink:#efe8e4; --muted:#ab9f99; --line:#352c29;
  --esq:#0a0807; --chip:#2a2220; --rojo:#ff4d5e; --azul:#6aa3ff; --oro:#e6bf5c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#120e0d; --surface:#1c1615; --ink:#efe8e4; --muted:#ab9f99; --line:#352c29;
  --esq:#0a0807; --chip:#2a2220; --rojo:#ff4d5e; --azul:#6aa3ff; --oro:#e6bf5c; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;margin:0;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--esq)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--oro);outline-offset:2px}
a{color:var(--rojo)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--esq);color:var(--esq-ink)}
.hd{display:flex;align-items:center;gap:10px;padding:10px 16px 4px;max-width:1100px;margin:0 auto}
.hd img{width:38px;height:38px;border-radius:8px}
.hd h1{font-family:var(--display);font-weight:400;font-size:28px;letter-spacing:1px;margin:0;line-height:1}
.hd .sub{font-family:var(--label);font-size:12px;letter-spacing:1.5px;opacity:.8;text-transform:uppercase}
.hd .sp{flex:1}
.tabs{display:flex;max-width:1100px;margin:0 auto;padding:0 8px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{color:var(--esq-ink);opacity:.7;text-decoration:none;font-family:var(--label);font-weight:700;font-size:16px;letter-spacing:1px;text-transform:uppercase;padding:10px 12px;border-bottom:3px solid transparent;white-space:nowrap}
.tabs a[aria-current="page"]{opacity:1;border-bottom-color:var(--rojo)}
.tabs .cnt{background:var(--rojo);color:#fff;border-radius:999px;padding:0 6px;font-size:12px;margin-left:4px}
main{max-width:1100px;margin:0 auto;padding:14px 16px calc(40px + env(safe-area-inset-bottom,0px))}
h2.t{font-family:var(--display);font-weight:400;font-size:34px;letter-spacing:.5px;margin:4px 0 6px;line-height:1.05;text-wrap:balance}
h3.s{font-family:var(--label);font-size:15px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:600;background:var(--chip);color:var(--ink);display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn.pri{background:var(--rojo);color:#fff}
.btn.osc{background:var(--esq);color:#fff}
.btn.dan{background:transparent;color:var(--rojo);border:1.5px solid var(--rojo)}
.btn.sm{padding:6px 10px;font-size:14px}
.btn.big{font-size:18px;padding:14px 18px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
a.card,button.card{text-align:left;color:inherit;text-decoration:none;width:100%}
.card h3{font-family:var(--label);font-size:19px;font-weight:700;margin:0;line-height:1.15;text-wrap:balance}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.list{display:flex;flex-direction:column;gap:8px}
.meta{display:flex;flex-wrap:wrap;gap:5px;font-size:13px;color:var(--muted);align-items:center}
.tag{font-family:var(--label);font-weight:700;font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:var(--ink);background:var(--chip);border-radius:4px;padding:1px 6px}
.tag.r{background:var(--rojo);color:#fff}.tag.v{background:var(--descanso);color:#fff}.tag.o{background:var(--oro);color:#1d1715}.tag.l{background:#d97706;color:#fff}
.not{font-family:var(--mono);font-size:14px;background:var(--chip);border-radius:6px;padding:3px 7px;word-break:break-word}
.note{font-size:13px;color:var(--muted)}
.empty{border:2px dashed var(--line);border-radius:12px;padding:24px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.obj{background:color-mix(in srgb,var(--oro) 16%,var(--surface));border-left:4px solid var(--oro);padding:8px 12px;border-radius:0 8px 8px 0;margin:6px 0}
.vig{background:color-mix(in srgb,var(--rojo) 10%,var(--surface));border-left:4px solid var(--rojo);padding:8px 12px;border-radius:0 8px 8px 0;margin:6px 0}
.obj b,.vig b{font-family:var(--label);letter-spacing:1px;text-transform:uppercase;font-size:13px;display:block}
.err{background:color-mix(in srgb,var(--rojo) 12%,var(--surface));border:1.5px solid var(--rojo);border-radius:8px;padding:8px 12px;margin:8px 0}
.ok{background:color-mix(in srgb,var(--descanso) 12%,var(--surface));border:1.5px solid var(--descanso);border-radius:8px;padding:8px 12px;margin:8px 0}
.back{background:none;border:0;color:var(--rojo);font-weight:700;padding:4px 0;margin-bottom:4px}
.md h2,.md h3,.md h4{font-family:var(--label);margin:14px 0 4px;line-height:1.15}
.md h3{font-size:19px}.md h4{font-size:17px;color:var(--muted)}
.md p{margin:6px 0}.md ul,.md ol{margin:4px 0;padding-left:22px}
.md li{margin:2px 0}.md li.in{margin-left:18px;list-style:circle}
.md .callout{background:var(--chip);border-radius:8px;padding:8px 12px;margin:6px 0}
.md a.int{color:var(--rojo);font-weight:600;text-decoration:none;border-bottom:1.5px solid color-mix(in srgb,var(--rojo) 35%,transparent)}
.md .todo{list-style:none;margin-left:-20px}
.props{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 12px;font-size:14px;margin:8px 0}
.props dt{font-family:var(--label);font-weight:700;letter-spacing:.5px;color:var(--muted)}
.props dd{margin:0}
.rels a{display:inline-block;margin:2px 4px 2px 0}
.chiprow{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-family:var(--label);font-weight:600;font-size:14px;letter-spacing:.3px;text-decoration:none;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--esq);color:#fff;border-color:var(--esq)}
:root[data-theme="dark"] .chip[aria-pressed="true"]{background:var(--rojo);border-color:var(--rojo)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{background:var(--rojo);border-color:var(--rojo)}}
.seg{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.seg::-webkit-scrollbar{display:none}
details.fil{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;margin:8px 0}
details.fil summary{font-family:var(--label);font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;padding:4px 0}
.fgrp{margin:8px 0}.fgrp>div:first-child{font-family:var(--label);font-weight:700;font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
input[type=text],input[type=search],input[type=email],input[type=number],select,textarea{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:9px 10px;font-size:16px}
textarea{min-height:84px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-family:var(--label);font-weight:700;font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin:10px 0}
label.f .req{color:var(--rojo)}
.form{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
.pick{max-height:260px;overflow:auto;border:1.5px solid var(--line);border-radius:8px;padding:6px;display:flex;flex-direction:column;gap:4px}
.pick label{display:flex;gap:8px;align-items:flex-start;font-family:var(--body);text-transform:none;letter-spacing:0;font-weight:500;color:var(--ink);font-size:15px;padding:4px}
.ord{display:flex;flex-direction:column;gap:6px}
.ord .it{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:8px;align-items:center;background:var(--chip);border-radius:8px;padding:6px 8px}
.ord .n{width:26px;height:26px;border-radius:50%;background:var(--rojo);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:18px}
.ord button{border:1.5px solid var(--line);background:var(--surface);border-radius:6px;width:34px;height:34px;font-weight:700}
.fase{font-family:var(--label);font-weight:700;letter-spacing:1px;text-transform:uppercase;font-size:13px;color:var(--muted);margin:10px 0 4px}
.prog{display:flex;flex-direction:column;gap:4px}
.prog div{padding:6px 10px;border-radius:8px;background:var(--surface);border:1.5px solid var(--line)}
.prog div.aqui{border-color:var(--rojo);box-shadow:inset 4px 0 0 var(--rojo)}
.dg{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px;margin:10px 0}
.dg svg{width:100%;height:auto;display:block;max-width:520px;margin:0 auto}
.ab{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ab>div{border-radius:10px;padding:8px 10px;color:#fff}
.ab .a{background:var(--rojo)}.ab .b{background:var(--azul)}
.ab b{font-family:var(--display);font-size:22px;font-weight:400;letter-spacing:1px;display:block}
.toast{max-width:min(92vw,520px);text-align:center;position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;z-index:60}
.crumb{font-size:13px;color:var(--muted);margin:2px 0 4px}.crumb a{color:var(--rojo);text-decoration:none;font-weight:600}
a.card.fila{flex-direction:row;align-items:center;gap:10px}
.fila .dm{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.cnt2{font-family:var(--display);font-size:26px;line-height:1;color:var(--rojo);min-width:36px;text-align:right}.cnt2.cero{color:var(--muted)}
.semcab{font-family:var(--label);font-weight:700;font-size:14px;letter-spacing:.8px;color:var(--muted);margin:14px 0 2px}
.semcab b{color:var(--ink)}
.card.dia{flex-direction:row;align-items:center;gap:12px}
.card.dia .dn{font-family:var(--display);font-size:30px;line-height:1;color:var(--rojo);width:54px;flex:none;text-transform:uppercase}
.card.dia .dm{flex:1;min-width:0}
.card.dia .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.card.dia.hoy{border-color:var(--rojo)}
.card.dia.pasado{opacity:.6}
@media (max-width:520px){.card.dia{flex-wrap:wrap}.card.dia .acts{width:100%;justify-content:flex-start}}
.picker{margin:0 0 4px}
.bq{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-top:1px solid var(--line)}
.bq .dm{flex:1;min-width:0}.bq .acts{display:flex;gap:4px;flex:none}
.banner{background:var(--oro);color:#1d1715;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-weight:600}
/* ---------- Modo clase ---------- */
#clase{position:fixed;inset:0;z-index:50;background:var(--prep);color:#fff;display:none;flex-direction:column;
  padding:calc(8px + env(safe-area-inset-top,0px)) 14px calc(10px + env(safe-area-inset-bottom,0px));
  touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:background .25s}
#clase.on{display:flex}
#clase.trabajo{background:var(--trabajo)}#clase.descanso{background:var(--descanso)}#clase.fin{background:#000}
#clase .top{display:flex;align-items:flex-start;gap:8px}
#clase .top .tt{flex:1;min-width:0}
#clase .fz{font-family:var(--label);letter-spacing:1.5px;text-transform:uppercase;font-size:14px;opacity:.85}
#clase .bt{font-family:var(--display);font-size:clamp(24px,min(6.5vw,7vh),52px);line-height:1;margin:2px 0;text-wrap:balance}
#clase .ic{background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:12px;min-width:48px;height:48px;font-size:22px;font-weight:700}
#clase .mid{flex:1;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:0}
#clase .est{font-family:var(--display);font-size:clamp(28px,min(9vw,8vh),80px);letter-spacing:3px;line-height:1}
#clase .rel{font-family:var(--display);font-weight:400;font-size:clamp(90px,min(34vw,38vh),330px);line-height:.9;font-variant-numeric:tabular-nums;letter-spacing:2px}
#clase .eti{font-family:var(--label);font-weight:700;font-size:clamp(18px,4.6vw,34px);line-height:1.15;max-width:950px;text-wrap:balance}
#clase .rnd{font-family:var(--label);font-weight:700;font-size:clamp(18px,4.4vw,30px);opacity:.9;margin-top:4px}
#clase .barra{height:8px;background:rgba(255,255,255,.25);border-radius:4px;overflow:hidden;margin:8px 0}
#clase .barra i{display:block;height:100%;background:#fff;width:0}
#clase .pz{font-size:15px;opacity:.95;max-height:24vh;overflow:auto;background:rgba(0,0,0,.18);border-radius:10px;padding:6px 10px;touch-action:pan-y}
#clase .pz div{padding:2px 0}
#clase .ctl{display:grid;grid-template-columns:1fr 1.6fr 1fr;gap:10px;margin-top:8px}
#clase .ctl button{height:72px;border-radius:16px;border:0;background:rgba(255,255,255,.18);color:#fff;font-size:20px;font-weight:700;font-family:var(--label);letter-spacing:1px}
#clase .ctl button.pp{background:#fff;color:#000;font-size:26px}
#clase .ctl button:disabled{opacity:.35}
#clase .hint{font-size:12px;opacity:.7;text-align:center;margin-top:4px}
@media (orientation:landscape) and (max-height:520px){#clase .pz,#clase .hint{display:none}#clase .ctl button{height:56px}#clase .bt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#clase .rel{font-size:min(30vw,44vh)}#clase .barra{margin:4px 0}}
.sheet{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--surface);color:var(--ink);border-radius:16px 16px 0 0;width:min(640px,100%);max-height:88vh;overflow:auto;padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));touch-action:pan-y;overscroll-behavior:contain}
.sheet h3{font-family:var(--display);font-weight:400;font-size:28px;margin:0 0 6px}
</style>
</head>
<body>
<header>
  <div class="hd"><img src="icons/icon-192.png" alt=""><div><h1>Esquina del Entrenador</h1><div class="sub" id="sub"></div></div><div class="sp"></div></div>
  <nav class="tabs" id="tabs"></nav>
</header>
<main id="app"></main>
<section id="clase" aria-live="polite"></section>
<div id="sheet"></div>
<script>
"use strict";
// ---------- Versión y novedades (la más nueva arriba) ----------
const VERSION="1.3";
const NOVEDADES=[
  ["1.3","27-oct-2026",["Biblioteca nueva: se entra por las fases de la clase (calentamiento, físico, técnica, saco, sparring y vuelta a la calma) y por nivel.",
    "Cada bloque dice en qué sesiones y planes se usa, y arriba tienes la ruta para volver (Biblioteca › Fase › Bloque › Ejercicio).",
    "Ejercicios por fundamento, buscador en toda la biblioteca y un apartado «Por ordenar» con lo que no llega a ninguna clase.",
    "Clases: técnica, saco y sparring son intercambiables (quita o añade fases al revisar), y el calentamiento y la vuelta a la calma rotan."]],
  ["1.2","27-oct-2026",["Nueva pestaña «Clases»: tus días de clase en un calendario, semana a semana, con lo que toca del plan.",
    "En cada día: «Del plan» (su plantilla), «Generar» (una propuesta con tus bloques según la semana del plan, la última clase y tus indicaciones) o «Elegir» (copiar otra clase).",
    "Revisas la clase antes de guardarla: cambia cualquier bloque con ↻, los minutos y el objetivo. Se manda a Notion desde «Enviar»."]],
  ["1.1","22-oct-2026",["Se actualiza sola: con tu contraseña (Ajustes → Sincronización) descarga tus datos cifrados al abrirla, en el móvil y en el PC.","El botón «Actualizar ahora» para traer lo último en cualquier momento."]],
  ["1.0","18-oct-2026",["Primera versión: biblioteca de Fundamentos, Ejercicios, Físico, Bloques y Correcciones con filtros.",
    "Planes y sesiones: el plan en curso, su progresión por semanas y la clase de hoy.",
    "Modo clase: temporizador de asaltos, Tabata, interválicas, estaciones y fases, con campana, vibración y pantalla grande.",
    "Cerrar la clase (Sensaciones, Hecha o Saltada) y crear o editar ejercicios y bloques, que se envían por correo para pasarlos a Notion.",
    "Instalable en el móvil y sin conexión."]]];
const $=s=>document.querySelector(s), app=$("#app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/\s+/g," ").trim();
const hoyISO=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const fechaCorta=f=>{if(!f)return"";const d=new Date(f.slice(0,10)+"T12:00");return d.toLocaleDateString("es-ES",{weekday:"short",day:"numeric",month:"short"})};
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
function toast(m,ms=2600){const t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),ms)}

// ---------- Almacén en este dispositivo ----------
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}};
const BASES=["fundamentos","ejercicios","fisico","bloques","correcciones","sesiones","planes","fuentes"];
const S={datos:null,locales:LS.get("esq.locales",{}),pend:LS.get("esq.pend",[]),enviados:LS.get("esq.enviados",[]),
  timers:LS.get("esq.timers",{}),aj:LS.get("esq.ajustes",{correo:"",sonido:true,vibrar:true,tema:""}),
  fil:LS.get("esq.filtros",{}),idx:{}};
function guardar(){LS.set("esq.locales",S.locales);LS.set("esq.pend",S.pend);LS.set("esq.enviados",S.enviados);LS.set("esq.timers",S.timers);LS.set("esq.ajustes",S.aj);LS.set("esq.filtros",S.fil)}

// ---------- Datos: lo importado de Notion + lo creado aquí ----------
function reindexar(){
  S.idx={};
  for(const b of BASES) for(const x of (S.datos?.[b]||[])) S.idx[x.id]={b,x};
  for(const [id,l] of Object.entries(S.locales)) S.idx[id]={b:l.base,x:{...l.item,id,_local:l.accion}};
  // Heredados (solo lectura), como los rollups de Notion
  for(const x of lista("bloques")){
    x._fund=[...new Set((x["Ejercicios"]||[]).flatMap(i=>get(i)?.["Fundamentos"]||[]))];
    x._patron=[...new Set((x["Físico"]||[]).flatMap(i=>get(i)?.["Patrón de movimiento"]||[]))];
  }
}
const get=id=>S.idx[id]?.x;
const baseDe=id=>S.idx[id]?.b;
const lista=b=>Object.values(S.idx).filter(e=>e.b===b).map(e=>e.x);

function inline(s){
  return esc(s).replace(/\*\*([^*]+?)\*\*/g,"<b>$1</b>").replace(/(^|[\s(])\*([^*\s][^*]*?)\*(?=[\s).,;:]|$)/g,"$1<i>$2</i>")
    .replace(/\[([^\]]*)\]\(#([0-9a-f]{32})\)/g,(m,t,id)=>`<a class="int" href="#/f/${id}">${t||esc(titulo(id))}</a>`)
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function md(txt){
  if(!txt)return"";
  const out=[];let lst=null;
  const cerrar=()=>{if(lst){out.push(`</${lst}>`);lst=null}};
  for(const raw of txt.split("\n")){
    const sang=/^\s{2,}/.test(raw), l=raw.trim();
    let m;
    if(!l){cerrar();continue}
    if((m=l.match(/^(#{1,3})\s+(.*)/))){cerrar();const h=Math.min(4,m[1].length+1);out.push(`<h${h}>${inline(m[2])}</h${h}>`);continue}
    if((m=l.match(/^- \[( |x)\]\s*(.*)/))){if(lst!=="ul"){cerrar();out.push("<ul>");lst="ul"}out.push(`<li class="todo${sang?" in":""}">${m[1]==="x"?"☑":"☐"} ${inline(m[2])}</li>`);continue}
    if((m=l.match(/^[-•]\s+(.*)/))){if(!sang&&lst!=="ul"){cerrar();out.push("<ul>");lst="ul"}if(!lst){out.push("<ul>");lst="ul"}out.push(`<li${sang?' class="in"':""}>${inline(m[1])}</li>`);continue}
    if((m=l.match(/^\d+\.\s+(.*)/))){if(!sang&&lst!=="ol"){cerrar();out.push("<ol>");lst="ol"}if(!lst){out.push("<ol>");lst="ol"}out.push(`<li${sang?' class="in"':""}>${inline(m[1])}</li>`);continue}
    cerrar();
    if((m=l.match(/^>\s*(.*)/))){out.push(`<div class="callout">${inline(m[1])}</div>`);continue}
    if(l==="---"){out.push("<hr>");continue}
    out.push(`<p>${inline(l)}</p>`);
  }
  cerrar();return `<div class="md">${out.join("")}</div>`;
}

function lineaDe(txt,clave){const l=(txt||"").split("\n").find(x=>norm(x).startsWith(norm(clave)));return l?l.slice(l.indexOf(":")+1).trim():""}
function estadoPlan(p){
  const ses=sesDePlan(p),hoy=hoyISO();
  const fechadas=ses.filter(s=>s["Fecha"]).sort((a,b)=>a["Fecha"].localeCompare(b["Fecha"]));
  const pasadas=fechadas.filter(s=>s["Fecha"]<hoy), ultima=pasadas.at(-1);
  const plantillas=ses.filter(s=>s["Plantilla"]);
  let semana=1,dia="martes",terminado=false;
  if(ultima&&ultima["Semana"]){
    const d=diaNombre(ultima);semana=ultima["Semana"];
    if(d==="martes")dia="jueves";else{dia="martes";semana++}
    if(semana>(p["Duración (semanas)"]||99))terminado=true;
  }
  const plantilla=plantillas.find(s=>s["Semana"]===semana&&diaNombre(s)===dia);
  return {ses,fechadas,pasadas,ultima,plantillas,semana,dia,terminado,plantilla,despues:lineaDe(p["Estructura/Progresión"],"Después")};
}

// Bloques de una sesión en el orden del cuerpo, con los minutos que da la sesión
function pasosDeSesion(s){
  const pasos=[];let faseMin=null,fase="",enFase=0;
  const lineas=(s.cuerpo||"").split("\n");
  const porFase={};
  for(const l of lineas){
    const h=l.match(/^#{2,3}\s+(?:\d+\.\s*)?(.*)/);
    if(h){fase=h[1].replace(/\*\*/g,"");const m=fase.match(/(\d+)\s*min/);faseMin=m?+m[1]:null;continue}
    for(const m of l.matchAll(/\]\(#([0-9a-f]{32})\)/g)){
      if(baseDe(m[1])!=="bloques")continue;
      const resto=l.slice(l.indexOf(m[0])+m[0].length);const mm=resto.match(/(\d+)\s*min/);
      const p={id:m[1],fase,min:mm?+mm[1]:null,faseMin};pasos.push(p);(porFase[fase]=porFase[fase]||[]).push(p);
    }
  }
  for(const ps of Object.values(porFase)) if(ps.length===1&&!ps[0].min) ps[0].min=ps[0].faseMin;
  for(const b of s["Bloques"]||[]) if(!pasos.some(p=>p.id===b)&&get(b)) pasos.push({id:b,fase:"",min:null});
  return pasos;
}

// ---------- Clases: calendario, «Del plan», «Generar» y «Elegir» (1.2) ----------
// Como el calendario de la Pizarra: tus días de clase, semana a semana. En cada día sin clase,
// la siguiente del plan (su plantilla si la hay), una propuesta generada con tus bloques o una
// copia de otra. Se guarda en este dispositivo y va a Notion por «Enviar»: la Rutina crea la Sesión.
const DIAS_N=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
S.dias=LS.get("esq.dias",[2,4]);
S.borr=LS.get("esq.borrador",null);
const isoDe=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const ordSem=d=>(d+6)%7; // lunes primero
const diasOrd=()=>[...S.dias].sort((a,b)=>ordSem(a)-ordSem(b));

// Qué toca del plan en cada día de clase sin sesión: la siguiente tras la última con semana
function proyeccion(p,fechas){

  if(!fechas.length)return out;
  const conSem=e.fechadas.filter(s=>s["Semana"]);
  const previa=conSem.filter(s=>s["Fecha"]<fechas[0]).at(-1);
  let sem=previa?previa["Semana"]:0,i=previa?hueco(previa):n-1;

  const todas=[...new Set([...fechas,...conSem.map(s=>s["Fecha"]).filter(f=>f>=fechas[0])])].sort();
  for(const f of todas){
    const s=conSem.find(x=>x["Fecha"]===f);
    if(s){sem=s["Semana"];i=hueco(s);continue}
    if(ocupado.has(f)||f<hoy||!fechas.includes(f))continue;
    i++;if(i>=n){i=0;sem++}

// ----- Generar: el esqueleto del grupo (criterio-fichas-boxeo) relleno con tus bloques -----

const VACIAS=new Set("segun tecnico tecnica suave primer primero repaso nada poca poco mucha mucho gente hoy para como sobre entre desde hasta donde cuando cada todo toda todos todas semana semanas clase clases grupo intermedio avanzado iniciacion basico tambien solo sola pero esta este estos estas hacer hace sale salga sesion bloque bloques primer primera segundo minutos golpes golpe trabajo trabajar".split(" "));

  for(const w of [...(t.match(/\d(?:-\d)+/g)||[]),...t.split(/[^a-zñ0-9-]+/).filter(w=>w.length>3&&!VACIAS.has(w)&&!/^\d/.test(w))]){const k=w.length>6?w.slice(0,6):w;if(!out.has(k))out.set(k,w)}

function textoBloque(b){return norm([b.titulo,b["Objetivo"],b["Desarrollo"],b["Tipo"],b["Notas"],...(b["Ejercicios"]||[]).map(i=>{const e=get(i);return e?[e.titulo,e["Notación"],(e["Intención"]||[]).join(" ")].join(" "):""})].join(" "))}
const NIV={"Básico":0,"Iniciación":0,"Intermedio":1,"Avanzado":2};

// Elegir / Del plan: copia una clase o plantilla con sus fases y sus «por qué»
function fasesDe(s){const out=[];let fa=null;
  for(const l of (s.cuerpo||"").split("\n")){

// El nombre de fase de una sesión copiada, en el esqueleto del grupo (para ↻ y «Añadir otro»)

    return `<div class="fgrp"><div>${esc(etq||campo)}</div><div class="chiprow">${ops.map(([v,t])=>`<button class="chip" data-fil="${esc(campo)}" data-val="${esc(v)}" aria-pressed="${(F[campo]||[]).includes(v)}">${esc(t)}</button>`).join("")}</div></div>`;

function tarjetaFicha(base,x,extra=""){
  const m=[];
  if(base==="ejercicios")m.push(tags(x["Nivel"]),tags(x["Tipo"]),tags(x["Se trabaja en"]));
  if(base==="fisico")m.push(tags(x["Categoría"]),tags(x["Patrón de movimiento"]),tags(x["Nivel"]));
  if(base==="bloques")m.push(tags(x["Método"],"r"),tags(x["Formato"]),x["Duración (min)"]?`<span>${x["Duración (min)"]} min</span>`:"",tags(x["Nivel"]));
  if(base==="fundamentos"||base==="correcciones")m.push(tags(x["Categoría"]));
  if(x._local)m.push('<span class="tag l">Sin pasar a Notion</span>');
  const sub=base==="ejercicios"&&x["Notación"]&&norm(x["Notación"])!==norm(x.titulo)?`<div class="not">${esc(x["Notación"])}</div>`:
    base==="fundamentos"?`<div class="note">${esc(x["Descripción"]||"")}</div>`:base==="correcciones"?`<div class="note">${esc(x["Detalle"]||"")}</div>`:
    base==="fisico"?`<div class="note">${esc(x["Series/Reps o Duración"]||"")}</div>`:"";
  return `<a class="card" href="#/f/${x.id}"><h3>${esc(x.titulo)}</h3>${sub}<div class="meta">${m.join("")}${extra}</div></a>`;
}

function parejaAB(not){

      <circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="var(--line)" stroke-width="3" stroke-dasharray="6 8"/>
      ${pts.map(([px,py],i)=>{const a=-Math.PI/2+(i+.5)*2*Math.PI/n;const ax=cx+(R+0)*Math.cos(a),ay=cy+R*Math.sin(a);
        return `<path d="M${(cx+R*Math.cos(a-.12)).toFixed(1)} ${(cy+R*Math.sin(a-.12)).toFixed(1)} A${R} ${R} 0 0 1 ${(cx+R*Math.cos(a+.12)).toFixed(1)} ${(cy+R*Math.sin(a+.12)).toFixed(1)}" fill="none" stroke="var(--muted)" stroke-width="3" marker-end="url(#fl)" style="color:var(--muted)"/>`}).join("")}
      ${pts.map(([px,py],i)=>`<g><circle cx="${px}" cy="${py}" r="20" fill="var(--rojo)"/><text x="${px}" y="${py+7}" text-anchor="middle" font-family="Bebas Neue,Impact,sans-serif" font-size="22" fill="#fff">${i+1}</text>

      <text x="${cx}" y="${cy+5}" text-anchor="middle" font-size="13" fill="var(--muted)" font-family="Barlow,sans-serif">rotación ↻</text></svg>

// ---------- Temporizador: propuesta a partir de la ficha ----------
const num=s=>parseFloat(String(s).replace(",","."));
function etiquetasNumeradas(t){const out=[];for(const m of t.matchAll(/(?:^|\s)(\d)\)\s*(.+?)(?=\s\d\)\s|$)/g))out.push(m[2].replace(/[.\s]+$/,""));return out}
function sugerir(b,minSesion){
  const t=String(b["Desarrollo"]||"").replace(/\s+/g," "),met=b["Método"]||"",dur=b["Duración (min)"]||minSesion||null;
  const rolM=t.match(/(\d+)"\s*cada rol/),rol=rolM?+rolM[1]:0;
  let m;
  // Tabata
  if(met==="Tabata"||/tabata/i.test(t)){
    const r=+(t.match(/(\d+)\s*rondas/)||[])[1]||8,tw=t.match(/(\d+)"\s*(?:de\s*)?trabajo\s*\/\s*(\d+)"/);
    return {p:{modo:"intervalos",rondas:r,trabajo:tw?+tw[1]:20,descanso:tw?+tw[2]:10,rol:0},de:"Tabata leído de la ficha"}}
  // Circuito por estaciones
  if(met==="Circuito/estaciones"||/estaciones/i.test(t)){
    const nombres=[...(b["Físico"]||[]),...(b["Ejercicios"]||[])].map(titulo);
    const est=+(t.match(/(\d+)\s*estaciones/)||[])[1]||nombres.length||4;
    const tw=t.match(/(\d+)"\s*trabajo\s*\/\s*(\d+)"\s*(?:de\s*)?cambio/);
    const vu=t.match(/(\d+)\s*vueltas(?:\s*con\s*(\d+(?:[.,]\d+)?)\s*min)?/);
    if(tw)return {p:{modo:"circuito",estaciones:est,nombres,vueltas:vu?+vu[1]:3,trabajo:+tw[1],cambio:+tw[2],descansoVuelta:vu&&vu[2]?num(vu[2])*60:60},de:"Leído de la ficha: «"+tw[0]+(vu?" · "+vu[0]:"")+"»"}}
  // Asaltos «3 asaltos de 3 min con 1 min», «3 rounds de 3' / 1'»
  if((m=t.match(/(\d+)\s*(?:asaltos?|rounds?)(?:\s+de\s+[a-záéíóú]+)?\s+de\s+(\d+(?:[.,]\d+)?)\s*(?:min|')[^\d]{0,30}?(\d+(?:[.,]\d+)?)\s*(?:min|')/i))){
    const r=+m[1],et=etiquetasNumeradas(t);
    return {p:{modo:"intervalos",rondas:r,trabajo:num(m[2])*60,descanso:num(m[3])*60,rol,etiquetas:et.length===r?et:[]},de:"Leído de la ficha: «"+m[0]+"»"}}
  // Fases con minutos «1) … (9 min). 2) … (8 min)»
  const fases=[...t.matchAll(/(?:^|[.;:]\s*|\d\)\s*)([^.;:()]{3,80}?)\s*\(~?(\d+(?:[.,]\d+)?)\s*min\)/g)].map(x=>({nombre:x[1].trim(),seg:num(x[2])*60}));
  if(fases.length>=2)return {p:{modo:"fases",fases,rol},de:"Fases y minutos leídos de la ficha"};
  // «4 fases de ~6 min», «4 contras de 8' cada uno»
  if((m=t.match(/(\d+)\s+([a-záéíóú]+)\s+de\s+~?(\d+(?:[.,]\d+)?)\s*(?:min|')\s*(?:cada uno)?/i))&&!/asalto|round|serie/i.test(m[2])){
    const n=+m[1],et=etiquetasNumeradas(t);
    return {p:{modo:"fases",fases:[...Array(n)].map((_,i)=>({nombre:et[i]||`${m[2][0].toUpperCase()+m[2].slice(1)} ${i+1}`,seg:num(m[3])*60})),rol},de:"Leído de la ficha: «"+m[0].trim()+"»"}}
  // Intervalos «30"/30" ×6», «20" libre / 20" velocidad / 20" fuerza ×3»
  if((m=t.match(/((?:\d+"\s*[^\/×\d"]*\/\s*)+\d+"\s*[^\/×\d"]*?)\s*[×x]\s*(\d+)/))){
    const partes=m[1].split("/").map(s=>{const z=s.trim().match(/(\d+)"\s*(.*)/);return {seg:+z[1],nombre:z[2].trim()}});
    const rep=+m[2],desc=partes.filter(p=>/descanso|pausa|cambio/i.test(p.nombre));
    if(partes.length===2&&desc.length===1&&/descanso|pausa|cambio/i.test(partes[1].nombre))
      return {p:{modo:"intervalos",rondas:rep,trabajo:partes[0].seg,descanso:partes[1].seg,rol:0,etiquetas:[...Array(rep)].map(()=>partes[0].nombre)},de:"Leído de la ficha: «"+m[0]+"»"};
    const fs=[];for(let i=0;i<rep;i++)for(const p of partes)fs.push({nombre:(p.nombre||"Trabajo")+` (${i+1}/${rep})`,seg:p.seg,descanso:/descanso|pausa|cambio/i.test(p.nombre)});
    return {p:{modo:"fases",fases:fs,rol:0},de:"Leído de la ficha: «"+m[0]+"»"}}
  // «6 min por ejercicio» (escaleras)
  if((m=t.match(/(\d+(?:[.,]\d+)?)\s*min por ejercicio/))){
    const nombres=(b["Físico"]||[]).map(titulo);
    if(nombres.length)return {p:{modo:"fases",fases:nombres.map(n=>({nombre:n,seg:num(m[1])*60})),rol:0},de:"Leído de la ficha: «"+m[0]+"», una fase por pieza"}}
  if(met==="Asaltos"){
    const r=dur?Math.max(1,Math.round((dur+1)/4)):3;
    return {p:{modo:"intervalos",rondas:r,trabajo:180,descanso:60,rol},de:`La ficha no da los tiempos: propuesta estándar de 3'/1'${dur?` para ${dur} min`:""}. Ajústala si no es así.`}}
  if(dur)return {p:{modo:"fases",fases:[{nombre:b.titulo,seg:dur*60}],rol},de:(b["Duración (min)"]?"Duración de la ficha":"Minutos que da la sesión")+`: ${dur} min${rol?`, cambio de rol cada ${rol}"`:""}`};
  return {p:{modo:"crono",objetivo:0},de:"La ficha no da tiempos: cronómetro libre."};
}
const programaDe=(id,min)=>{const b=get(id);if(S.timers[id])return {p:S.timers[id],de:"Programa guardado en este móvil"};return b?sugerir(b,min):{p:{modo:"crono",objetivo:0},de:""}};
function tramos(p){
  const T=[],add=(tipo,seg,etiqueta,extra={})=>{if(seg>0)T.push({tipo,seg,etiqueta,...extra})};
  add("prep",10,"");
  if(p.modo==="intervalos")for(let r=1;r<=p.rondas;r++){add("trabajo",p.trabajo,(p.etiquetas||[])[r-1]||"",{ronda:`${r} / ${p.rondas}`,rol:p.rol});if(r<p.rondas)add("descanso",p.descanso,"Descanso",{ronda:`${r} / ${p.rondas}`})}
  if(p.modo==="circuito")for(let v=1;v<=p.vueltas;v++){for(let e=1;e<=p.estaciones;e++){add("trabajo",p.trabajo,`Estación ${e}${p.nombres?.[e-1]?": "+p.nombres[e-1]:""}`,{ronda:`Vuelta ${v} / ${p.vueltas}`});if(e<p.estaciones)add("descanso",p.cambio,"Cambio de estación",{ronda:`Vuelta ${v} / ${p.vueltas}`,sig:p.nombres?.[e]||""})}
    if(v<p.vueltas)add("descanso",p.descansoVuelta,"Descanso entre vueltas",{ronda:`Vuelta ${v} / ${p.vueltas}`})}
  if(p.modo==="fases")p.fases.forEach((f,i)=>add(f.descanso?"descanso":"trabajo",f.seg,f.nombre,{ronda:`Fase ${i+1} / ${p.fases.length}`,rol:f.descanso?0:p.rol}));
  if(p.modo==="crono")T.push({tipo:"trabajo",seg:p.objetivo>0?p.objetivo:Infinity,etiqueta:p.objetivo>0?"":"Cronómetro libre",crono:!(p.objetivo>0)});
  let t0=0;for(const x of T){x.t0=t0;t0+=x.seg}
  return T;
}
const mmss=s=>{if(!isFinite(s))return"∞";s=Math.max(0,Math.ceil(s));const m=Math.floor(s/60),r=s%60;return m+":"+String(r).padStart(2,"0")};
const resumenProg=p=>p.modo==="intervalos"?`${p.rondas} × ${mmss(p.trabajo)} / ${mmss(p.descanso)}${p.rol?` · cambio de rol cada ${p.rol}"`:""}`:
  p.modo==="circuito"?`${p.estaciones} estaciones · ${p.trabajo}" + ${p.cambio}" · ${p.vueltas} vueltas`:
  p.modo==="fases"?`${p.fases.length} fases · ${mmss(p.fases.reduce((a,f)=>a+f.seg,0))}${p.rol?` · cambio de rol cada ${p.rol}"`:""}`:
  p.objetivo>0?`Cronómetro hasta ${mmss(p.objetivo)}`:"Cronómetro libre";

// ---------- Sonido, vibración y pantalla encendida ----------
const AU={ctx:null,nodos:[],vivo:null,
  init(){if(!this.ctx){const C=window.AudioContext||window.webkitAudioContext;if(C)this.ctx=new C()}if(this.ctx&&this.ctx.state==="suspended")this.ctx.resume();return this.ctx},
  tono(at,f,dur,vol=.5,tipo="sine"){const c=this.ctx;if(!c||!S.aj.sonido)return;const o=c.createOscillator(),g=c.createGain();o.type=tipo;o.frequency.value=f;
    g.gain.setValueAtTime(0,at);g.gain.linearRampToValueAtTime(vol,at+.01);g.gain.exponentialRampToValueAtTime(.001,at+dur);o.connect(g).connect(c.destination);o.start(at);o.stop(at+dur+.05);this.nodos.push(o)},
  campana(at,n=3){for(let i=0;i<n;i++){this.tono(at+i*.32,1180,.9,.55,"triangle");this.tono(at+i*.32,2360,.5,.18)}},
  fin(at){this.tono(at,520,1.1,.6,"square")},
  aviso(at){this.tono(at,1600,.08,.5,"square");this.tono(at+.18,1600,.08,.5,"square")},
  rol(at){this.tono(at,880,.15,.5,"square");this.tono(at+.22,880,.15,.5,"square")},
  tic(at){this.tono(at,1000,.07,.35,"square")},
  cancelar(){for(const o of this.nodos){try{o.stop(0)}catch(e){}}this.nodos=[]},
  // Un sonido inaudible continuo mantiene vivo el audio con la pantalla bloqueada (Android)
  mantener(on){const c=this.ctx;if(!c)return;if(on&&!this.vivo){const o=c.createOscillator(),g=c.createGain();g.gain.value=.0001;o.frequency.value=40;o.connect(g).connect(c.destination);o.start();this.vivo=o}
    if(!on&&this.vivo){try{this.vivo.stop()}catch(e){}this.vivo=null}}};
function programarSonidos(T,desde){
  const c=AU.ctx;if(!c)return;AU.cancelar();const base=c.currentTime-desde;
  for(const x of T){
    const ini=x.t0,fin=x.t0+x.seg;
    if(ini>=desde-.05){if(x.tipo==="trabajo")AU.campana(base+ini,x.crono?1:3);else if(x.tipo==="descanso")AU.fin(base+ini)}
    if(x.tipo==="prep")for(let k=3;k>=1;k--)if(fin-k>=desde)AU.tic(base+fin-k);
    if(x.tipo==="trabajo"&&isFinite(x.seg)){
      if(x.seg>=30&&fin-10>=desde)AU.aviso(base+fin-10);
      if(x.rol)for(let k=ini+x.rol;k<fin-1;k+=x.rol)if(k>=desde)AU.rol(base+k);
    }
    if(x.tipo==="descanso"&&x.seg>=15&&fin-5>=desde)AU.tic(base+fin-5);
  }
  const ult=T.at(-1);if(ult&&isFinite(ult.t0+ult.seg)){const f=ult.t0+ult.seg;if(f>=desde)AU.campana(base+f,4)}
}
const vibrar=p=>{if(S.aj.vibrar&&navigator.vibrate)try{navigator.vibrate(p)}catch(e){}};
let wake=null;
async function pantallaEncendida(on){try{if(on&&"wakeLock" in navigator&&!wake){wake=await navigator.wakeLock.request("screen");wake.addEventListener("release",()=>{wake=null})}if(!on&&wake){await wake.release();wake=null}}catch(e){}}

// ---------- Modo clase ----------
const C={on:false,pasos:[],i:0,T:[],corriendo:false,inicio:0,acum:0,seg:-1,sesion:null,timer:null};
function abrirClase(pasos,sesion){
  if(!pasos.length){toast("Esta sesión no tiene bloques enlazados");return}
  Object.assign(C,{on:true,pasos,i:0,sesion,corriendo:false,acum:0,seg:-1});
  cargarPaso();$("#clase").classList.add("on");document.body.style.overflow="hidden";
  pantallaEncendida(true);history.pushState({clase:1},"");pintarClase();
}
function cargarPaso(){const p=C.pasos[C.i];const pr=p.prog?{p:p.prog,de:"Asaltos libres"}:programaDe(p.id,p.min);C.prog=pr;C.T=tramos(pr.p);C.acum=0;C.corriendo=false;C.seg=-1;AU.cancelar()}
const transcurrido=()=>C.acum+(C.corriendo?(performance.now()-C.inicio)/1000:0);
function arrancar(){AU.init();AU.mantener(true);C.inicio=performance.now();C.corriendo=true;programarSonidos(C.T,C.acum);
  if("mediaSession" in navigator)try{navigator.mediaSession.metadata=new MediaMetadata({title:titulo(C.pasos[C.i].id)||"Asaltos",artist:"Esquina del Entrenador"})}catch(e){}
  tic()}
function parar(){C.acum=transcurrido();C.corriendo=false;AU.cancelar();AU.mantener(false);pintarClase()}
function irPaso(d){const n=C.i+d;if(n<0||n>=C.pasos.length)return;const seguia=C.corriendo;C.i=n;cargarPaso();if(seguia)arrancar();pintarClase()}
function saltarTramo(){const e=transcurrido(),x=C.T.find(x=>e<x.t0+x.seg);if(!x||!isFinite(x.seg))return;C.acum=x.t0+x.seg+.01;if(C.corriendo){C.inicio=performance.now();programarSonidos(C.T,C.acum)}pintarClase()}
function tic(){clearTimeout(C.timer);if(!C.on)return;pintarCrono();if(C.corriendo)C.timer=setTimeout(tic,200)}
function salirClase(desdeAtras){C.on=false;C.corriendo=false;clearTimeout(C.timer);AU.cancelar();AU.mantener(false);pantallaEncendida(false);
  $("#clase").classList.remove("on");$("#clase").className="";document.body.style.overflow="";if(!desdeAtras)history.back()}
window.addEventListener("popstate",()=>{if(C.on)salirClase(true)});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&!C.on&&Date.now()-(S.ultSinc||0)>5*60e3)sincronizar(false)});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&C.on){pantallaEncendida(true);AU.init();pintarCrono()}});
function pintarClase(){
  const p=C.pasos[C.i],b=get(p.id);
  const piezas=b?[...(b["Ejercicios"]||[]),...(b["Físico"]||[])].map(get).filter(Boolean):[];
  $("#clase").innerHTML=`<div class="top"><div class="tt"><div class="fz">${esc(p.fase||(C.sesion?"Bloque":""))} · ${C.i+1} de ${C.pasos.length}</div><div class="bt">${esc(b?b.titulo:"Asaltos libres")}</div></div>
    <button class="ic" data-c="prog" aria-label="Ajustar el tiempo">⚙</button><button class="ic" data-c="salir" aria-label="Salir del modo clase">✕</button></div>
    <div class="barra"><i id="cbar"></i></div>
    <div class="mid" id="cmid" data-c="pp"><div class="est" id="cest"></div><div class="rel" id="crel"></div><div class="eti" id="ceti"></div><div class="rnd" id="crnd"></div></div>
    ${piezas.length?`<div class="pz">${piezas.map(e=>`<div><b>${esc(e.titulo)}</b>${e["Notación"]&&norm(e["Notación"])!==norm(e.titulo)?` · <span style="font-family:var(--mono)">${esc(e["Notación"])}</span>`:""}</div>`).join("")}</div>`:""}
    <div class="ctl"><button data-c="ant" ${C.i?"":"disabled"} aria-label="Bloque anterior">◀ Bloque</button><button class="pp" data-c="pp" id="cpp"></button><button data-c="sig" aria-label="${C.i<C.pasos.length-1?"Bloque siguiente":"Terminar"}">${C.i<C.pasos.length-1?"Bloque ▶":"Terminar"}</button></div>
    <div class="hint">${esc(resumenProg(C.prog.p))} · Toca el reloj para pausar · Desliza para cambiar de bloque · <button data-c="saltar" style="background:none;border:0;color:#fff;text-decoration:underline;padding:0">saltar tramo</button></div>`;
  pintarCrono();
}
function pintarCrono(){
  if(!C.on)return;const e=transcurrido(),T=C.T,i=T.findIndex(x=>e<x.t0+x.seg),el=$("#clase");
  if(i<0){el.className="on fin";$("#cest").textContent="¡Tiempo!";$("#crel").textContent="0:00";$("#ceti").textContent=C.i<C.pasos.length-1?"Siguiente: "+titulo(C.pasos[C.i+1].id):"Fin de la clase";$("#crnd").textContent="";$("#cbar").style.width="100%";
    if(C.corriendo){C.corriendo=false;C.acum=e;AU.mantener(false);vibrar([400,150,400,150,400])}$("#cpp").textContent=C.i<C.pasos.length-1?"Siguiente ▶":"Cerrar clase";return}
  const x=T[i];
  if(i!==C.seg){if(C.seg>=0&&C.corriendo)vibrar(x.tipo==="trabajo"?[300,120,300]:[600]);C.seg=i}
  el.className="on "+(x.tipo==="prep"?"":x.tipo);
  $("#cest").textContent=x.crono?"Cronómetro":x.tipo==="prep"?(C.corriendo?"Preparados":"Listo"):x.tipo==="trabajo"?"Trabajo":"Descanso";
  $("#crel").textContent=x.crono?mmss(e-x.t0):mmss(x.t0+x.seg-e);
  $("#ceti").textContent=x.tipo==="descanso"&&x.sig?"Siguiente: "+x.sig:x.tipo==="prep"?(T[i+1]?.etiqueta||""):x.etiqueta||"";
  $("#crnd").textContent=x.ronda||"";
  const tot=T.at(-1).t0+T.at(-1).seg;$("#cbar").style.width=isFinite(tot)?Math.min(100,e/tot*100)+"%":"0";
  $("#cpp").textContent=C.corriendo?"❚❚ Pausa":e>0?"▶ Seguir":"▶ Empezar";
}
// Gestos con un dedo: tocar el reloj = pausa; deslizar a los lados = cambiar de bloque
(()=>{const cl=$("#clase");let x0=null,y0=0,t0=0;
  cl.addEventListener("pointerdown",e=>{x0=e.clientX;y0=e.clientY;t0=Date.now()});
  cl.addEventListener("pointerup",e=>{if(x0==null)return;const dx=e.clientX-x0,dy=e.clientY-y0;x0=null;
    if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.5&&Date.now()-t0<800){irPaso(dx<0?1:-1);cl.dataset.swiped=Date.now()}});
  cl.addEventListener("click",e=>{if(Date.now()-(+cl.dataset.swiped||0)<400)return;const t=e.target.closest("[data-c]");if(!t)return;const c=t.dataset.c;
    if(c==="pp"){const e2=transcurrido(),fin=C.T.findIndex(x=>e2<x.t0+x.seg)<0;
      if(fin){if(C.i<C.pasos.length-1)irPaso(1);else{const s=C.sesion;salirClase();if(s&&baseDe(s)==="sesiones")setTimeout(()=>ir("/cerrar/"+s),50)}return}
      C.corriendo?parar():arrancar();pintarCrono()}
    if(c==="ant")irPaso(-1);
    if(c==="sig"){if(C.i<C.pasos.length-1)irPaso(1);else{const s=C.sesion;salirClase();if(s&&baseDe(s)==="sesiones")setTimeout(()=>ir("/cerrar/"+s),50)}}
    if(c==="saltar")saltarTramo();
    if(c==="salir")salirClase();
    if(c==="prog"){if(C.corriendo)parar();editarPrograma()}});
})();
function editarPrograma(){
  const paso=C.pasos[C.i],id=paso.id,p=JSON.parse(JSON.stringify(C.prog.p));
  const b=id?get(id):null;
  const campo=(k,etq,v)=>`<label class="f">${etq}<input type="text" inputmode="numeric" data-k="${k}" value="${esc(v)}"></label>`;
  const cuerpo=()=>p.modo==="intervalos"?campo("rondas","Asaltos o rondas",p.rondas)+campo("trabajo","Trabajo (m:ss)",mmss(p.trabajo))+campo("descanso","Descanso (m:ss)",mmss(p.descanso))+campo("rol",'Cambio de rol cada (segundos, 0 = no)',p.rol||0):
    p.modo==="circuito"?campo("estaciones","Estaciones",p.estaciones)+campo("vueltas","Vueltas",p.vueltas)+campo("trabajo","Trabajo por estación (m:ss)",mmss(p.trabajo))+campo("cambio","Cambio (m:ss)",mmss(p.cambio))+campo("descansoVuelta","Descanso entre vueltas (m:ss)",mmss(p.descansoVuelta)):
    p.modo==="fases"?`<label class="f">Fases: una por línea, «nombre | m:ss»<textarea data-k="fases" rows="6">${esc(p.fases.map(f=>`${f.nombre} | ${mmss(f.seg)}${f.descanso?" | descanso":""}`).join("\n"))}</textarea></label>`+campo("rol",'Cambio de rol cada (segundos, 0 = no)',p.rol||0):
    campo("objetivo","Hasta (m:ss, 0 = libre)",p.objetivo?mmss(p.objetivo):0);
  const pinta=()=>{$("#sheet").innerHTML=`<div class="sheet" data-s="fondo"><div role="dialog" aria-label="Ajustar el tiempo"><h3>Tiempo del bloque</h3>
    ${b?`<p class="note">${esc(C.prog.de)}</p>${b["Desarrollo"]?`<p class="note"><b>Desarrollo:</b> ${esc(b["Desarrollo"])}</p>`:""}`:""}
    <label class="f">Tipo<select data-k="modo">${[["intervalos","Asaltos / intervalos"],["circuito","Circuito por estaciones"],["fases","Fases seguidas"],["crono","Cronómetro"]].map(([k,t])=>`<option value="${k}"${k===p.modo?" selected":""}>${t}</option>`).join("")}</select></label>
    ${cuerpo()}<div class="bar" style="margin-top:10px"><button class="btn pri" data-s="ok">Guardar</button>${b?`<button class="btn" data-s="prop">Volver a la propuesta</button>`:""}<button class="btn" data-s="no">Cancelar</button></div></div></div>`};
  const seg=v=>{v=String(v).trim();if(v.includes(":")){const [m,s]=v.split(":");return (+m||0)*60+(+s||0)}return +v||0};
  const leer=()=>{$("#sheet").querySelectorAll("[data-k]").forEach(el=>{const k=el.dataset.k,v=el.value;
    if(k==="modo")return;if(k==="fases")p.fases=v.split("\n").filter(l=>l.trim()).map(l=>{const z=l.split("|").map(s=>s.trim());return {nombre:z[0],seg:seg(z[1]||0),descanso:/descanso/i.test(z[2]||"")}});
    else if(["rondas","estaciones","vueltas","rol"].includes(k))p[k]=Math.max(k==="rol"?0:1,parseInt(v)||0);else p[k]=seg(v)})};
  pinta();
  $("#sheet").onchange=e=>{if(e.target.dataset.k==="modo"){leer();const m=e.target.value;p.modo=m;
    if(m==="intervalos"){p.rondas=p.rondas||3;p.trabajo=p.trabajo||180;p.descanso=p.descanso??60}
    if(m==="circuito"){p.estaciones=p.estaciones||4;p.vueltas=p.vueltas||3;p.trabajo=p.trabajo||45;p.cambio=p.cambio??15;p.descansoVuelta=p.descansoVuelta??60;p.nombres=p.nombres||(b?(b["Físico"]||[]).map(titulo):[])}
    if(m==="fases")p.fases=p.fases||[{nombre:b?b.titulo:"Fase 1",seg:600}];
    if(m==="crono")p.objetivo=p.objetivo||0;pinta()}};
  $("#sheet").onclick=e=>{const s=e.target.dataset.s;if(!s)return;
    if(s==="fondo"&&e.target.classList.contains("sheet")||s==="no"){$("#sheet").innerHTML="";return}
    if(s==="prop"){if(id)delete S.timers[id];guardar();cerrarHoja();return}
    if(s==="ok"){leer();if(id){S.timers[id]=p;guardar()}else paso.prog=p;cerrarHoja()}};
  const cerrarHoja=()=>{$("#sheet").innerHTML="";cargarPaso();pintarClase()};
}

// ---------- Cerrar una clase ----------
function vCerrar(id){
  const s=get(id);if(!s)return noEsta();
  const prev=S.pend.find(p=>p.tipo==="cierre"&&p.sesion.id===id)||{};
  return `<button class="back" onclick="history.back()">← Atrás</button><h2 class="t">Cerrar la clase</h2><p><b>${esc(s.titulo)}</b></p>
  ${s["Plantilla"]?`<p class="note">Es una plantilla: al pasarlo a Notion se crea la clase con fecha de hoy a partir de ella, como hace la Rutina.</p>`:""}
  <div class="form"><label class="f">¿Cómo fue?<div class="chiprow">${["Hecha","Saltada"].map(e=>`<button class="chip" data-estado="${e}" aria-pressed="${(prev.estado||"Hecha")===e}">${e}</button>`).join("")}</div></label>
  <label class="f">Fecha de la clase<input type="text" id="c-fecha" value="${esc(prev.fecha||(s["Plantilla"]?hoyISO():s["Fecha"]||hoyISO()))}"></label>
  <label class="f">Sensaciones<textarea id="c-sens" placeholder="Cómo respondió el grupo, qué salió y qué no">${esc(prev.sensaciones||"")}</textarea></label>
  <label class="f">Para la próxima (opcional)<textarea id="c-prox" placeholder="Qué ajustar en la siguiente clase">${esc(prev.paraLaProxima||"")}</textarea></label>
  <label class="f" id="c-lugarw" style="${(prev.estado||"Hecha")==="Saltada"?"":"display:none"}">Qué se hizo en su lugar<input type="text" id="c-lugar" value="${esc(prev.enSuLugar||"")}"></label>
  <p class="note">Solo «Nº alumnos aprox»: no apuntes nombres de alumnos.</p>
  <div class="bar"><button class="btn pri" data-guardarcierre="${id}">Guardar para enviar a Notion</button></div></div>`;
}
function guardarCierre(id){
  const s=get(id),estado=document.querySelector("[data-estado][aria-pressed=true]")?.dataset.estado||"Hecha";
  const c={tipo:"cierre",uid:uid(),creado:new Date().toISOString(),estado,fecha:$("#c-fecha").value.trim(),
    sensaciones:$("#c-sens").value.trim(),paraLaProxima:$("#c-prox").value.trim(),enSuLugar:$("#c-lugar").value.trim(),
    sesion:{id,titulo:s.titulo,plantilla:!!s["Plantilla"],plan:(s["Plan"]||[])[0]||null,semana:s["Semana"]||null,fecha:s["Fecha"]||null}};
  if(!/^\d{4}-\d{2}-\d{2}$/.test(c.fecha)){toast("La fecha va como AAAA-MM-DD");return}
  if(estado==="Hecha"&&!c.sensaciones){toast("Apunta las Sensaciones: es lo que usa la Rutina para preparar la siguiente");return}
  if(estado==="Saltada"&&!c.enSuLugar){toast("Di qué se hizo en su lugar");return}
  S.pend=S.pend.filter(p=>!(p.tipo==="cierre"&&p.sesion.id===id));S.pend.push(c);
  if(!s["Plantilla"]){s["Estado"]=estado;s["Sensaciones"]=c.sensaciones||s["Sensaciones"]}
  guardar();toast("Guardado. Mándalo a Notion desde Enviar");ir("/enviar");
}

// Notación → Fundamentos (tabla del criterio). Es una sugerencia: se confirma a mano.
const NOT_FUND=[[/media\s*esq/,"media esquiva"],[/\besq\.?\s*rot|\brot\b|\broll\b|rotatoria/,"esquiva rotatoria"],[/\besq\b|\besq\.|esquiva(?!\s*rot)/,"esquiva / slip"],
  [/ballesta/,"ballesta"],[/palmeo/,"palmeo"],[/\bbloq/,"bloqueo"],[/pivot/,"pivote"],[/paso atras/,"paso atras"],[/pendulo/,"paso pendulo"],[/pasos? en v/,"pasos en v"],[/cambio de guardia/,"cambio de guardia"],
  [/(^|[^\d"'])1(?![\d"'])|\bjab\b/,"(1)"],[/(^|[^\d"'])2(?![\d"'])|\bdir\b|directo|\bcross\b/,"(2)"],[/(^|[^\d"'])3(?![\d"'])|cro\.?\s*izq|crochet izq/,"(3)"],[/(^|[^\d"'])4(?![\d"'])|cro\.?\s*der|crochet der/,"(4)"],
  [/(^|[^\d"'])5(?![\d"'])|upper izq/,"(5)"],[/(^|[^\d"'])6(?![\d"'])|upper der/,"(6)"]];
function fundDesdeNotacion(not){
  let t=norm(not).replace(/\d+\s*("|'|min\b|s\b)|[×x]\s*\d+/g," ");
  const out=new Set(),fs=lista("fundamentos");
  for(const [re,clave] of NOT_FUND){if(!re.test(t))continue;
    const f=fs.find(f=>norm(f.titulo).includes(clave));if(f)out.add(f.id);
    if(clave==="media esquiva")t=t.replace(/media\s*esq\w*\.?/g," ")}
  return [...out];
}
const PLANTILLA_EJ={"Para qué sirve":"","Secuencia":"","Puntos clave":"","Errores comunes":"","Cómo entrenarla":""};
function cuerpoEj(c){const li=(t,p)=>t.split("\n").filter(l=>l.trim()).map((l,i)=>p==="1"?`${i+1}. ${l.trim()}`:`${p} ${l.trim()}`).join("\n");
  return [c["Para qué sirve"]?`> 🎯 **Para qué sirve** — ${c["Para qué sirve"]}`:"",c["Secuencia"]?"## Secuencia\n"+li(c["Secuencia"],"1"):"",c["Puntos clave"]?"## Puntos clave\n"+li(c["Puntos clave"],"-"):"",
    c["Errores comunes"]?"## Errores comunes\n"+li(c["Errores comunes"],"-"):"",c["Cómo entrenarla"]?"## Cómo entrenarla\n"+li(c["Cómo entrenarla"],"- [ ]"):""].filter(Boolean).join("\n")}
function seccionesDe(cuerpo){const out={};let k=null;for(const l of (cuerpo||"").split("\n")){
  const cal=l.match(/^>\s*🎯\s*\*\*Para qué sirve\s*(?:—\s*)?\*\*\s*(?:—\s*)?(.*)/);if(cal){out["Para qué sirve"]=cal[1].replace(/\[([^\]]*)\]\(#\w+\)/g,"$1");continue}
  const h=l.match(/^##\s+(.*)/);if(h){k=h[1].trim();out[k]="";continue}
  if(k)out[k]+=(out[k]?"\n":"")+l.replace(/^\s*(\d+\.|-\s\[[ x]\]|-)\s*/,"").replace(/\[([^\]]*)\]\(#\w+\)/g,"$1")}
  return out}

function leerEditor(){

function validar(E){
  const v=E.v,err=[],otros=lista(E.base).filter(x=>x.id!==E.id);
  const falta=k=>!v[k]||(Array.isArray(v[k])&&!v[k].length);
  if(E.base==="ejercicios"){
    for(const k of ["titulo","Notación","Tipo","Grupo","Nivel","Se trabaja en","Fundamentos"])if(falta(k))err.push(`Falta «${k==="titulo"?"Ejercicio":k}».`);
    if(v["Nº golpes"]!=null&&isNaN(v["Nº golpes"]))err.push("«Nº golpes» tiene que ser un número.");
    const d=otros.find(x=>norm(x["Notación"])&&norm(x["Notación"])===norm(v["Notación"])||norm(x.titulo)===norm(v.titulo));
    if(d)err.push(`Ya existe: <a class="int" href="#/f/${d.id}">${esc(d.titulo)}</a>. Edita esa en vez de duplicarla (P2).`);
  }else{
    for(const k of ["titulo","Tipo","Formato","Método","Nivel","Desarrollo"])if(falta(k))err.push(`Falta «${k==="titulo"?"Bloque":k}».`);
    if(v.titulo&&!/\s—\s/.test(v.titulo))err.push("El título va como «Formato — Qué» (con raya: —).");
    const piezas=[...(v["Ejercicios"]||[]),...(v["Físico"]||[])];
    if(!piezas.length&&!E.regla)err.push("Un bloque se monta con piezas que ya tienen ficha: añade Ejercicios o Físico (o marca que es una regla de formato).");
    const clave=x=>[...(x["Ejercicios"]||[]),...(x["Físico"]||[])].sort().join(",")+"|"+(x["Método"]||"");
    const d=otros.find(x=>norm(x.titulo)===norm(v.titulo)||(piezas.length&&clave(x)===clave(v)));
    if(d)err.push(`Ya existe: <a class="int" href="#/f/${d.id}">${esc(d.titulo)}</a> (${norm(d.titulo)===norm(v.titulo)?"mismo nombre":"mismas piezas y mismo método"}). Edita esa en vez de duplicarla (P2).`);
  }
  if(!(v["Fuente"]||[]).length&&!E.proc&&!E.id)err.push("Di de dónde sale: una Fuente o la procedencia (P5).");
  return err;
}

function importar(txt,sinc){
  let d;try{d=JSON.parse(txt)}catch(e){toast("Ese archivo no es de la Esquina");return}
  if(d&&d.app==="esquina-entrenador"&&d.tipo==="copia"){S.datos=d.datos;S.locales=d.locales||{};S.pend=d.pend||[];S.timers=d.timers||{};LS.set("esq.datos",S.datos);guardar();reindexar();toast("Copia restaurada");render();return}
  if(!d||d.app!=="esquina-entrenador"||!BASES.some(b=>Array.isArray(d[b]))){toast("Ese archivo no es de la Esquina");return}
  if(d.parcial){
    if(!S.datos||S.datos.ejemplos){toast("Primero importa el archivo completo; este solo trae los últimos cambios");return}
    let n=0;for(const b of BASES){const m=new Map((S.datos[b]||[]).map(x=>[x.id,x]));for(const x of d[b]||[]){m.set(x.id,x);n++}S.datos[b]=[...m.values()]}
    S.datos.exportado=d.exportado;
  }else S.datos=d;
  // Lo ya enviado a Notion antes de este export ya está allí: se quita la copia local
  const envio=S.enviados.filter(e=>e.enviado<d.exportado).flatMap(e=>e.envios);
  for(const p of envio)if(p.tipo==="ficha")delete S.locales[p.id];
  const enNotion=new Set((S.datos.sesiones||[]).filter(s=>s["Fecha"]&&!s["Plantilla"]).map(s=>s["Fecha"]));
  for(const p of S.enviados.flatMap(e=>e.envios))if(p.tipo==="sesion"&&enNotion.has(p.fecha))delete S.locales[p.id];
  if(!LS.set("esq.datos",S.datos)){toast("No cabe en este móvil");return}
  guardar();reindexar();toast(sinc?"Datos actualizados ("+fechaCorta(d.exportado)+")":d.parcial?"Cambios importados":"Datos importados");render();
}
// ---------- Sincronización: datos cifrados en el repo, la clave solo en este dispositivo ----------
async function sincronizar(manual){
  const clave=LS.get("esq.clave","");S.ultSinc=Date.now();
  if(!clave){if(manual)toast("Pon la contraseña en Ajustes → Sincronización");return}
  let r;try{const res=await fetch("datos.enc.json",{cache:"no-store"});if(!res.ok){if(manual)toast("Todavía no hay datos publicados");return}r=await res.json()}
  catch(e){if(manual)toast("Sin conexión: sigues con los datos guardados");return}
  if(!r||r.cifrado!==1)return;
  if(!manual&&S.datos&&!S.datos.ejemplos&&S.datos.exportado>=r.exportado)return;
  try{
    const u=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
    const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(clave),"PBKDF2",false,["deriveKey"]);
    const k=await crypto.subtle.deriveKey({name:"PBKDF2",hash:"SHA-256",salt:u(r.sal),iterations:r.iter},base,{name:"AES-GCM",length:256},false,["decrypt"]);
    const gz=await crypto.subtle.decrypt({name:"AES-GCM",iv:u(r.iv)},k,u(r.datos));
    const txt=await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
    if(manual&&S.datos&&!S.datos.ejemplos&&S.datos.exportado>=r.exportado){toast("Ya tienes lo último ("+fechaCorta(r.exportado)+")");return}
    importar(txt,true);
  }catch(e){toast("La contraseña no abre los datos: revísala en Ajustes",4500)}
}

  if(d.usar){const [p,pr]=planDe(d.usar);abrirBorrador(copiarClase(d.usar,pr,p,pr.plantilla));return}
  if(d.otro){leerBorrador();const [i,j]=d.otro.split(":").map(Number);otroBloque(i,j);LS.set("esq.borrador",S.borr);render();return}
  if(d.quitab){leerBorrador();const [i,j]=d.quitab.split(":").map(Number);S.borr.fases[i].bloques.splice(j,1);LS.set("esq.borrador",S.borr);render();return}
  if(d.masb){leerBorrador();const fa=S.borr.fases[+d.masb],us=new Set(S.borr.fases.flatMap(f=>f.bloques.map(b=>b.id))),c=fa.cand.find(([id])=>!us.has(id));if(c)fa.bloques.push({id:c[0],porque:c[1]});LS.set("esq.borrador",S.borr);render();return}
  if(d.quitafase){leerBorrador();S.borr.fases.splice(+d.quitafase,1);LS.set("esq.borrador",S.borr);render();return}
  if(d.anadefase){leerBorrador();const F=FASES.find(x=>x[0]===d.anadefase),us=new Set(S.borr.fases.flatMap(f=>f.bloques.map(b=>b.id)));
    const cand=lista("bloques").filter(b=>faseDe(b).includes(F[0])).sort((a,b)=>Math.abs((NIV[a["Nivel"]]??0)-(NIV[get(S.borr.plan)?.["Nivel"]]??1))-Math.abs((NIV[b["Nivel"]]??0)-(NIV[get(S.borr.plan)?.["Nivel"]]??1))).map(b=>[b.id,""]);
    const c=cand.find(([id])=>!us.has(id)),fa={nombre:F[0],min:F[1],cand,bloques:c?[{id:c[0],porque:""}]:[]};
    const iv=S.borr.fases.findIndex(f=>faseCanon(f.nombre)==="Vuelta a la calma");S.borr.fases.splice(iv<0?S.borr.fases.length:iv,0,fa);LS.set("esq.borrador",S.borr);render();return}
  if(d.guardarclase){guardarClase();return}
  if(d.descartar){S.borr=null;LS.set("esq.borrador",null);ir("/clases");return}
  if(d.fil){const b=S.fil._base,F=S.fil[b];const a=F[d.fil]||[];F[d.fil]=a.includes(d.val)?a.filter(x=>x!==d.val):[...a,d.val];guardar();render();return}
  if(d.limpiar){S.fil[d.limpiar]={};guardar();render();return}
  if(d.estado){document.querySelectorAll("[data-estado]").forEach(b=>b.setAttribute("aria-pressed",b===t));$("#c-lugarw").style.display=d.estado==="Saltada"?"":"none";return}
  if(d.guardarcierre){guardarCierre(d.guardarcierre);return}
  if(d.m){leerEditor();const v=S.edit.v,a=v[d.m]||[];v[d.m]=a.includes(d.val)?a.filter(x=>x!==d.val):[...a,d.val];t.setAttribute("aria-pressed",v[d.m].includes(d.val));return}
  if(d.sugerir){leerEditor();const f=fundDesdeNotacion(S.edit.v["Notación"]||S.edit.v.titulo);if(!f.length){toast("No reconozco golpes ni defensas en la notación");return}S.edit.v["Fundamentos"]=[...new Set([...(S.edit.v["Fundamentos"]||[]),...f])];render();toast("Revisa la sugerencia: lo ambiguo no se marca");return}
  if(d.anade){leerEditor();const k=baseDe(d.anade)==="fisico"?"Físico":"Ejercicios";S.edit.v[k]=[...(S.edit.v[k]||[]),d.anade];S.edit.qp="";render();return}
  if(d.quita){leerEditor();for(const k of ["Ejercicios","Físico"])S.edit.v[k]=(S.edit.v[k]||[]).filter(x=>x!==d.quita);render();return}
  if(d.sube){leerEditor();const v=S.edit.v,ps=[...(v["Ejercicios"]||[]),...(v["Físico"]||[])],i=+d.sube;if(i>0){[ps[i-1],ps[i]]=[ps[i],ps[i-1]];v["Ejercicios"]=ps.filter(p=>baseDe(p)!=="fisico");v["Físico"]=ps.filter(p=>baseDe(p)==="fisico")}render();return}
  if(d.guardarficha){guardarFicha();return}
  if(d.quitapend){const p=S.pend.find(p=>p.uid===d.quitapend);S.pend=S.pend.filter(p=>p.uid!==d.quitapend);if(p?.tipo==="ficha"||p?.tipo==="sesion")delete S.locales[p.id];guardar();reindexar();render();return}
  if(d.enviar){enviar();return}
  if(d.copiar){copiar();return}
  if(d.enviado){S.enviados.push({enviado:new Date().toISOString(),envios:S.pend});S.pend=[];S.esperando=false;guardar();render();toast("Hecho. La Rutina lo pasará a Notion");return}
  if(d.noenviado){S.esperando=false;render();return}
  if(d.guardarclave){LS.set("esq.clave",$("#a-clave").value);await sincronizar(true);return}
  if(d.sinc){await sincronizar(true);return}
  if(d.guardaraj){S.aj.correo=$("#a-correo").value.trim();guardar();toast("Guardado");render();return}
  if(d.aj){S.aj[d.aj]=!S.aj[d.aj];guardar();render();return}
  if(d.probar){AU.init();const c=AU.ctx;if(c){AU.campana(c.currentTime+.05);AU.aviso(c.currentTime+1.4)}vibrar([300,120,300]);return}
  if(d.copia){compartirArchivo("esquina-copia-"+hoyISO()+".json",{app:"esquina-entrenador",tipo:"copia",version:VERSION,datos:S.datos,locales:S.locales,pend:S.pend,timers:S.timers});return}
  if(d.borrar){S.borrar=true;render();return}
  if(d.borrarno){S.borrar=false;render();return}
  if(d.borrarsi){for(const k of ["esq.datos","esq.locales","esq.pend","esq.enviados","esq.timers","esq.filtros"])try{localStorage.removeItem(k)}catch(e){}
    Object.assign(S,{datos:null,locales:{},pend:[],enviados:[],timers:{},fil:{},borrar:false});reindexar();render();return}
  if(d.instalar&&promptInstalar){promptInstalar.prompt();promptInstalar=null;render();return}
});
app.addEventListener("input",ev=>{
  if(ev.target.id==="q"){S.fil["q_"+S.fil._base]=ev.target.value;clearTimeout(S.qt);S.qt=setTimeout(()=>{const pos=ev.target.selectionStart;render();const q=$("#q");if(q){q.focus();try{q.setSelectionRange(pos,pos)}catch(e){}}},250)}
  if(ev.target.id==="e-buscap"){S.edit.qp=ev.target.value;$("#e-pick").innerHTML=pickPiezas(S.edit)}
});
app.addEventListener("change",ev=>{if(ev.target.classList.contains("b-min")){leerBorrador();render()}});
app.addEventListener("input",ev=>{if(/^b-/.test(ev.target.id))leerBorrador();
  if(ev.target.id==="qt"){S.fil.q_todo=ev.target.value;clearTimeout(S.qt);S.qt=setTimeout(()=>{const pos=ev.target.selectionStart;render();const q=$("#qt");if(q){q.focus();try{q.setSelectionRange(pos,pos)}catch(e){}}},250)}});
app.addEventListener("change",async ev=>{if(ev.target.id==="importar"&&ev.target.files[0]){importar(await ev.target.files[0].text());ev.target.value=""}});
window.addEventListener("hashchange",()=>{const r=ruta();if(r.v!=="nuevo"&&r.v!=="editar")S.edit=null});

// ---------- Arranque ----------
(async()=>{
  if(S.aj.tema)document.documentElement.dataset.theme=S.aj.tema;
  cargarDatos();
  if(!S.datos&&!LS.get("esq.iniciada",false)){LS.set("esq.iniciada",true);await cargarEjemplos()}
  render();
  sincronizar(false);
  if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
  const vista=LS.get("esq.version",null);
  if(vista!==VERSION){LS.set("esq.version",VERSION);if(vista)setTimeout(()=>toast("Novedades de la versión "+VERSION+": "+NOVEDADES[0][2][0],5000),800)}
})();
</script>
</body></html>
